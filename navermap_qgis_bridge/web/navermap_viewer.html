<!doctype html>
<html lang="ko" class="centered-viewer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naver Map Viewer</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
__VIEWER_CSS__
  </style>
</head>
<body>
  <main id="viewer" class="layout-map-top">
    <header id="search-panel">
      <div id="viewer-toolbar">
      <button id="explorer-toggle" type="button" aria-expanded="true" aria-controls="explorer-body">탐색창 접기 ▴</button>
        <select id="viewer-layout" aria-label="지도와 로드뷰 배치">
          <option value="map-top">지도 위 / 로드뷰 아래</option>
          <option value="roadview-top">로드뷰 위 / 지도 아래</option>
          <option value="map-left">지도 좌 / 로드뷰 우</option>
          <option value="roadview-left">로드뷰 좌 / 지도 우</option>
        </select>
        <button id="fullscreen-toggle" type="button" title="전체화면 전환" aria-label="전체화면 전환">⛶</button>
      </div>
      <div id="explorer-body">
      <form id="search-form" role="search">
        <input id="search-query" type="search" aria-label="장소, 주소 또는 좌표 검색" placeholder="장소, 주소 또는 경도,위도 검색" autocomplete="off" disabled>
        <button id="search-submit" type="submit" disabled>검색</button>
        <button id="search-clear" type="button" title="검색 지우기" aria-label="검색 지우기" disabled>×</button>
      </form>
      <div id="map-options">
        <label for="map-type">지도</label>
        <select id="map-type" disabled>
          <option value="NORMAL">일반지도</option>
          <option value="SATELLITE">위성영상</option>
          <option value="HYBRID">위성영상+지명</option>
        </select>
        <button id="street-toggle" type="button" aria-pressed="false" disabled>로드뷰 도로 표시</button>
      </div>
      <div id="bridge-diagnostic" role="status" hidden></div>
      <span id="viewer-build">viewer build bridge-14</span>
      <span id="reverse-sync-diagnostic">역방향 대기</span>
      <div id="route-controls" aria-label="경로 탐색">
        <div id="route-options">
          <label class="route-label" for="route-priority">경로</label>
          <select id="route-priority" aria-label="경로 유형" disabled>
            <option value="RECOMMEND">실시간 최적</option>
            <option value="TIME">실시간 빠른길</option>
            <option value="DISTANCE">실시간 편한길</option>
          </select>
          <button id="route-avoid-toggle" type="button" title="경로 회피 옵션" aria-expanded="false" disabled>회피 0</button>
          <button id="route-vehicle-toggle" type="button" title="차량 설정" aria-expanded="false" disabled>차량</button>
          <button id="route-add-waypoint" type="button" title="경유지 추가" disabled>+ 경유지</button>
        </div>
        <div id="route-avoid-options" aria-label="경로 회피 옵션" hidden>
          <span>하나만 선택할 수 있으며, 선택 시 위 경로 유형을 대체합니다.</span>
          <label class="route-avoid-option"><input type="checkbox" value="toll">무료 우선</label>
          <label class="route-avoid-option"><input type="checkbox" value="motorway">자동차전용도로 회피</label>
        </div>
        <div id="route-vehicle-options" aria-label="차량 설정" hidden>
          <label class="route-vehicle-label" for="route-car-type">차종</label>
          <select id="route-car-type">
            <option value="1">소형</option>
            <option value="2">중형</option>
            <option value="3">대형</option>
            <option value="4">대형 화물</option>
            <option value="5">특수 화물</option>
            <option value="6">경차</option>
          </select>
          <label class="route-vehicle-label" for="route-car-fuel">유종</label>
          <select id="route-car-fuel">
            <option value="gasoline">휘발유</option>
            <option value="highgradegasoline">고급 휘발유</option>
            <option value="diesel">경유</option>
            <option value="lpg">LPG</option>
          </select>
          <label class="route-avoid-option" title="공개 경로 API에 하이패스 보유 여부를 지정하는 옵션이 없습니다. 하이패스 전용 톨게이트 안내는 응답에 포함될 수 있습니다."><input id="route-car-hipass" type="checkbox" disabled>하이패스 경로 설정 (API 미지원)</label>
        </div>
        <label class="route-label" for="route-origin-input">출발</label>
        <input id="route-origin-input" class="route-input" type="text" placeholder="장소, 주소 또는 경도,위도" autocomplete="off" disabled>
        <button id="route-origin-current" class="route-current" type="button" title="현재 지도 중심을 출발지로 사용" onclick="setRoutePointFromCurrent('origin')" disabled>현재 위치</button>
        <div id="route-waypoints" aria-label="경유지 목록"></div>
        <label class="route-label" for="route-destination-input">도착</label>
        <input id="route-destination-input" class="route-input" type="text" placeholder="장소, 주소 또는 경도,위도" autocomplete="off" disabled>
        <button id="route-destination-current" class="route-current" type="button" title="현재 지도 중심을 도착지로 사용" onclick="setRoutePointFromCurrent('destination')" disabled>현재 위치</button>
        <div id="route-actions">
          <button id="route-create" type="button" disabled>경로 생성</button>
          <button id="route-cancel" type="button" disabled>취소</button>
          <button id="route-history-open" type="button" title="경로 이력 열기" disabled>이력</button>
          <button id="route-swap" type="button" title="출발지와 도착지 바꾸기" aria-label="출발지와 도착지 바꾸기" disabled>⇅</button>
          <button id="route-reset" type="button" title="경로 입력 초기화" aria-label="경로 입력 초기화" disabled>×</button>
        </div>
      </div>
      <section id="route-guidance-panel" aria-label="경로 안내" data-collapsed="false" hidden>
        <div id="route-guidance-summary">
          <div id="route-panel-tabs" role="tablist" aria-label="경로 정보">
            <button id="route-guidance-tab" class="route-panel-tab is-active" type="button" role="tab" aria-selected="true">안내</button>
            <button id="route-history-tab" class="route-panel-tab" type="button" role="tab" aria-selected="false">이력</button>
          </div>
          <strong id="route-guidance-summary-text"></strong>
          <button id="route-guidance-toggle" type="button" title="경로 안내 접기" aria-label="경로 안내 접기">−</button>
        </div>
        <div id="route-guidance-list" role="listbox" aria-label="순서별 경로 안내"></div>
        <div id="route-history-list" role="listbox" aria-label="경로 이력" hidden></div>
      </section>
      <div id="search-results" role="listbox" aria-label="검색 결과" hidden></div>
      </div>
    </header>
    <section id="map" aria-label="Naver map"><div id="map-surface"></div></section>
    <div id="view-splitter" role="separator" aria-label="지도와 로드뷰 크기 조절" aria-orientation="horizontal">
      <button id="split-toggle" type="button" title="지도와 로드뷰 위치 전환" aria-label="지도와 로드뷰 위치 전환">⇅</button>
    </div>
    <section id="roadview" aria-label="Naver roadview">
      <div id="roadview-surface"></div>
      <div id="roadview-photo-date" role="status" aria-live="polite">촬영일 정보 없음</div>
    </section>
    <footer id="status-bar">
      <output id="status">Initializing Naver Map viewer...</output>
      <button id="open-history" type="button" disabled>네이버 지도에서 열기</button>
    </footer>
  </main>

  <script>
__VIEWER_JS__
  </script>
</body>
</html>
